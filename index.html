<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nikah Invitation</title>

<style>
:root{
  --sage:#66795f;
  --sage-dark:#405743;
  --forest:#263c2d;
  --ivory:#f5ecd8;
  --ivory-dark:#e8d9ba;
  --gold:#bc9346;
  --gold-light:#e4c878;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  background:#d8d0bd;
}

body{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:0 auto;
  overflow:hidden;
  font-family:Georgia,"Times New Roman",serif;
  background:var(--sage-dark);
  box-shadow:0 0 45px rgba(0,0,0,.28);
}

.invitation{
  position:relative;
  width:100%;
  min-height:100vh;
  min-height:100svh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 18%,
      rgba(224,211,165,.16),
      transparent 34%
    ),
    linear-gradient(
      180deg,
      #788970 0%,
      #596f59 48%,
      #3b5541 100%
    );
}

/* Fine outer gold frame */

.outer-frame{
  position:absolute;
  inset:12px;
  z-index:50;

  border:1px solid rgba(225,197,121,.75);
  border-radius:26px;

  pointer-events:none;
}

.inner-frame{
  position:absolute;
  inset:19px;
  z-index:49;

  border:1px solid rgba(225,197,121,.18);
  border-radius:21px;

  pointer-events:none;
}


/* ==================================
   IVORY ISLAMIC ARCH
================================== */

.arch{
  position:absolute;

  left:50%;
  top:6%;

  width:calc(100% - 76px);
  height:88%;

  transform:translateX(-50%);

  background:
    radial-gradient(
      ellipse at 50% 27%,
      rgba(255,255,255,.38),
      transparent 50%
    ),
    linear-gradient(
      180deg,
      #fbf4e4,
      #efe2c5
    );

  clip-path:polygon(
    50% 0%,
    57% 8%,
    67% 14%,
    72% 21%,
    86% 23%,
    92% 31%,
    92% 100%,
    8% 100%,
    8% 31%,
    14% 23%,
    28% 21%,
    33% 14%,
    43% 8%
  );

  filter:
    drop-shadow(
      0 15px 24px
      rgba(27,45,31,.18)
    );
}

.arch::before{
  content:"";

  position:absolute;
  inset:8px;

  clip-path:inherit;

  border:2px solid rgba(177,135,54,.58);
}


/* ==================================
   TOP FLORALS
================================== */

.floral{
  position:absolute;
  z-index:10;

  width:150px;
  height:205px;

  pointer-events:none;
}

.floral.left{
  top:-5px;
  left:-21px;
}

.floral.right{
  top:-5px;
  right:-21px;

  transform:scaleX(-1);
}

.flower{
  position:absolute;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #fff9e9 0 15%,
      #eadcba 16% 28%,
      #f8eed7 29% 42%,
      #d3c092 43% 47%,
      transparent 48%
    );

  box-shadow:
    0 5px 14px
    rgba(24,43,28,.24);
}

.flower.one{
  width:72px;
  height:72px;

  left:10px;
  top:17px;
}

.flower.two{
  width:52px;
  height:52px;

  left:68px;
  top:52px;
}

.flower.three{
  width:38px;
  height:38px;

  left:37px;
  top:91px;
}

.stem{
  position:absolute;

  left:76px;
  top:76px;

  width:65px;
  height:125px;

  border-left:
    2px solid
    rgba(211,182,102,.68);

  border-radius:
    55% 0 0 55%;

  transform:
    rotate(-23deg);
}

.leaf{
  position:absolute;

  width:36px;
  height:17px;

  border-radius:
    100% 0 100% 0;

  background:
    linear-gradient(
      135deg,
      #cbb875,
      #728865
    );
}

.leaf.l1{
  left:67px;
  top:92px;
  transform:rotate(-40deg);
}

.leaf.l2{
  left:95px;
  top:116px;
  transform:rotate(31deg);
}

.leaf.l3{
  left:65px;
  top:142px;
  transform:rotate(-31deg);
}

.leaf.l4{
  left:96px;
  top:164px;
  transform:rotate(38deg);
}

.bud{
  position:absolute;

  width:10px;
  height:10px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff0b9,
      #b78833
    );

  box-shadow:
    0 0 7px
    rgba(220,184,90,.4);
}

.bud.b1{
  left:111px;
  top:92px;
}

.bud.b2{
  left:79px;
  top:131px;
}


/* ==================================
   HANGING LANTERNS
================================== */

.lantern{
  position:absolute;
  z-index:15;

  top:34%;

  width:48px;
  height:115px;
}

.lantern.left{
  left:15px;
}

.lantern.right{
  right:15px;
}

.chain{
  position:absolute;

  left:50%;
  bottom:100%;

  width:1px;
  height:105px;

  transform:translateX(-50%);

  background:
    repeating-linear-gradient(
      180deg,
      #b98e39 0 4px,
      transparent 4px 8px
    );
}

.lantern-top{
  position:absolute;

  left:50%;
  top:0;

  width:31px;
  height:17px;

  transform:translateX(-50%);

  border-radius:50% 50% 15% 15%;

  background:
    linear-gradient(
      #e4c567,
      #8a6020
    );
}

.lantern-body{
  position:absolute;

  top:14px;
  left:50%;

  width:45px;
  height:69px;

  transform:translateX(-50%);

  border:3px solid #a97927;

  border-radius:
    10px 10px
    19px 19px;

  background:
    radial-gradient(
      circle,
      #fff0a4,
      rgba(230,176,63,.75) 42%,
      rgba(86,55,13,.9) 100%
    );

  box-shadow:
    0 0 25px
    rgba(255,214,101,.7);
}

.lantern-body::before,
.lantern-body::after{
  content:"";

  position:absolute;

  top:0;

  width:2px;
  height:100%;

  background:
    rgba(109,70,18,.72);
}

.lantern-body::before{
  left:12px;
}

.lantern-body::after{
  right:12px;
}

.lantern-bottom{
  position:absolute;

  left:50%;
  top:80px;

  width:22px;
  height:12px;

  transform:translateX(-50%);

  border-radius:
    0 0 50% 50%;

  background:
    linear-gradient(
      #c1943f,
      #76501a
    );
}

.lantern-bottom::after{
  content:"";

  position:absolute;

  left:50%;
  top:10px;

  width:1px;
  height:18px;

  transform:translateX(-50%);

  background:#a77b2e;
}


/* ==================================
   CENTRAL INTRO CONTENT
================================== */

.content{
  position:absolute;

  left:50%;
  top:50%;

  z-index:20;

  width:255px;

  transform:
    translate(-50%,-50%);

  text-align:center;
}

.bismillah{
  color:#8c692b;

  font-size:29px;
  line-height:1.65;
}

.gold-ornament{
  margin:
    10px auto 13px;

  color:#aa8133;

  font-size:23px;
}

.pre-title{
  color:#79663d;

  font-family:Arial,sans-serif;

  font-size:7px;

  font-weight:bold;

  letter-spacing:2.3px;

  text-transform:uppercase;
}

.invitation-title{
  margin-top:12px;

  color:#3d3a31;

  font-size:32px;

  font-style:italic;

  line-height:1.05;
}

.invitation-copy{
  max-width:215px;

  margin:10px auto 0;

  color:#665c49;

  font-size:12px;

  font-style:italic;

  line-height:1.45;
}


/* ==================================
   GOLD TAP TO OPEN SEAL
================================== */

.seal-wrap{
  position:relative;

  width:110px;
  height:110px;

  margin:
    28px auto 0;

  display:flex;
  align-items:center;
  justify-content:center;
}

.seal-glow{
  position:absolute;

  inset:-16px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(227,190,93,.28),
      transparent 70%
    );

  animation:
    pulseGlow
    2s
    infinite
    ease-in-out;
}

@keyframes pulseGlow{
  0%,
  100%{
    transform:scale(.9);
    opacity:.55;
  }

  50%{
    transform:scale(1.08);
    opacity:1;
  }
}

.tap-seal{
  position:relative;
  z-index:2;

  width:94px;
  height:94px;

  cursor:pointer;

  border:
    4px double
    #f1d48b;

  border-radius:
    48% 52%
    47% 53%;

  color:#fff3c9;

  background:
    radial-gradient(
      circle at 34% 25%,
      #f0d279,
      #c09136 48%,
      #744c15 100%
    );

  box-shadow:
    0 8px 18px
    rgba(68,44,6,.4),
    inset 0 0 0 5px
    rgba(103,65,14,.23);

  transition:
    transform .35s ease,
    opacity .4s ease;
}

.tap-seal span{
  display:block;

  font-family:
    Georgia,serif;

  font-size:16px;

  font-style:italic;

  line-height:1.1;
}

.tap-seal:active{
  transform:scale(.91);
}


/* ==================================
   BOTTOM TEXT
================================== */

.bottom-copy{
  position:absolute;

  left:20px;
  right:20px;
  bottom:7%;

  z-index:18;

  text-align:center;
}

.bottom-copy .line{
  width:60px;
  height:1px;

  margin:
    0 auto 10px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #b68a36,
      transparent
    );
}

.bottom-copy p{
  color:#8a713a;

  font-family:Arial,sans-serif;

  font-size:7px;

  letter-spacing:2.5px;

  text-transform:uppercase;
}


/* ==================================
   OPENING TRANSITION
================================== */

.light-burst{
  position:absolute;
  inset:0;

  z-index:70;

  opacity:0;

  pointer-events:none;

  background:
    radial-gradient(
      circle at center,
      rgba(255,251,225,.98),
      rgba(245,214,126,.68) 28%,
      transparent 70%
    );

  transform:
    scale(.35);

  transition:
    opacity .7s ease,
    transform 1s ease;
}

.invitation.opened
.light-burst{
  opacity:1;

  transform:
    scale(1.8);
}

.invitation.opened
.tap-seal{
  opacity:0;

  transform:
    scale(.4);
}

.invitation.opened
.content{
  animation:
    disappear
    .7s ease
    .5s forwards;
}

@keyframes disappear{
  to{
    opacity:0;
    transform:
      translate(-50%,-48%)
      scale(.96);
  }
}

.final-message{
  position:absolute;

  left:50%;
  top:50%;

  z-index:80;

  width:80%;

  opacity:0;

  transform:
    translate(-50%,-50%)
    translateY(20px);

  text-align:center;

  pointer-events:none;
}

.invitation.show-message
.final-message{
  animation:
    showMessage
    1s ease
    forwards;
}

@keyframes showMessage{
  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      translateY(0);
  }
}

.final-message .small{
  color:#f1dfad;

  font-family:Arial,sans-serif;

  font-size:8px;

  letter-spacing:3px;

  text-transform:uppercase;
}

.final-message h1{
  margin-top:12px;

  color:#fff4da;

  font-size:39px;

  font-style:italic;

  font-weight:normal;
}


/* Desktop keeps mobile invitation centred */

@media(min-width:431px){
  body{
    min-height:844px;
  }

  .invitation{
    min-height:844px;
  }
}

</style>
</head>


<body>

<main
  class="invitation"
  id="invitation"
>

  <div class="outer-frame"></div>
  <div class="inner-frame"></div>


  <!-- IVORY ARCH -->

  <div class="arch"></div>


  <!-- LEFT FLORALS -->

  <div class="floral left">

    <span class="flower one"></span>
    <span class="flower two"></span>
    <span class="flower three"></span>

    <span class="stem"></span>

    <span class="leaf l1"></span>
    <span class="leaf l2"></span>
    <span class="leaf l3"></span>
    <span class="leaf l4"></span>

    <span class="bud b1"></span>
    <span class="bud b2"></span>

  </div>


  <!-- RIGHT FLORALS -->

  <div class="floral right">

    <span class="flower one"></span>
    <span class="flower two"></span>
    <span class="flower three"></span>

    <span class="stem"></span>

    <span class="leaf l1"></span>
    <span class="leaf l2"></span>
    <span class="leaf l3"></span>
    <span class="leaf l4"></span>

    <span class="bud b1"></span>
    <span class="bud b2"></span>

  </div>


  <!-- LEFT LANTERN -->

  <div class="lantern left">

    <span class="chain"></span>
    <span class="lantern-top"></span>
    <span class="lantern-body"></span>
    <span class="lantern-bottom"></span>

  </div>


  <!-- RIGHT LANTERN -->

  <div class="lantern right">

    <span class="chain"></span>
    <span class="lantern-top"></span>
    <span class="lantern-body"></span>
    <span class="lantern-bottom"></span>

  </div>


  <!-- CENTRAL CONTENT -->

  <section class="content">

    <div class="bismillah">
      بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
    </div>

    <div class="gold-ornament">
      ❦
    </div>

    <div class="pre-title">
      A Special Nikah Invitation
    </div>

    <h1 class="invitation-title">
      You Are Cordially Invited
    </h1>

    <p class="invitation-copy">
      to share in the joy of a beautiful
      beginning and celebrate a union
      blessed with love and duas.
    </p>


    <div class="seal-wrap">

      <div class="seal-glow"></div>

      <button
        type="button"
        class="tap-seal"
        id="openButton"
      >
        <span>
          Tap<br>
          to<br>
          Open
        </span>
      </button>

    </div>

  </section>


  <div class="bottom-copy">

    <div class="line"></div>

    <p>
      A beautiful celebration awaits
    </p>

  </div>


  <!-- TRANSITION LIGHT -->

  <div class="light-burst"></div>


  <!-- TEST RESULT AFTER OPEN -->

  <div class="final-message">

    <div class="small">
      With love and prayers
    </div>

    <h1>
      Welcome
    </h1>

  </div>

</main>


<script>

const invitation =
  document.getElementById(
    "invitation"
  );

const openButton =
  document.getElementById(
    "openButton"
  );

let opened = false;


openButton.addEventListener(
  "click",
  function(){

    if(opened){
      return;
    }

    opened = true;


    invitation.classList.add(
      "opened"
    );


    setTimeout(
      function(){

        invitation.classList.add(
          "show-message"
        );

      },
      1050
    );

  }
);

</script>

</body>
</html>
