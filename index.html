  <style>
    :root {
      --forest: #293d2d;
      --ivory: #f8f1df;
      --gold: #c79e4d;
      --gold-light: #ecd38d;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      background: #d7d0bc;
    }

    body {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      overflow-x: hidden;
      background: var(--ivory);
      color: var(--forest);
      font-family: Baskerville, "Iowan Old Style", Georgia, serif;
      box-shadow: 0 0 45px rgba(0, 0, 0, 0.3);
    }

    body.locked {
      height: 100vh;
      height: 100svh;
      overflow: hidden;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--gold-light);
      outline-offset: 4px;
    }

    .screen {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .small-label {
      color: var(--gold-light);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Audio button */

    .audio-control {
      position: fixed;
      right: 14px;
      bottom: max(16px, calc(var(--safe-bottom) + 10px));
      z-index: 900;
      display: none;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      cursor: pointer;
      border: 1px solid rgba(238, 210, 135, 0.78);
      border-radius: 50%;
      background: linear-gradient(145deg, #485140f0, #27362af5);
      color: #f5dda0;
      font-size: 17px;
      box-shadow: 0 8px 22px rgba(10, 15, 11, 0.3);
    }

    .audio-control.visible {
      display: flex;
    }

    /* Screen 1 */

    #openingScreen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      width: min(100%, 430px);
      height: 100vh;
      height: 100svh;
      margin: 0 auto;
      background:
        radial-gradient(
          circle at 50% 12%,
          rgba(204, 220, 187, 0.25),
          transparent 40%
        ),
        linear-gradient(160deg, #7b8d72, #53684f 48%, #304733);
      transition: opacity 0.75s ease, visibility 0.75s ease;
    }

    #openingScreen.finished {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .opening-frame {
      position: absolute;
      inset:
        max(12px, var(--safe-top))
        13px
        max(12px, var(--safe-bottom));
      border: 1px solid rgba(232, 207, 142, 0.58);
      border-radius: 27px;
      pointer-events: none;
    }

    .opening-title {
      position: absolute;
      top: max(7%, calc(var(--safe-top) + 22px));
      left: 20px;
      right: 20px;
      z-index: 10;
      text-align: center;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .opening-active .opening-title {
      opacity: 0;
      transform: translateY(-14px);
    }

    .opening-arabic {
      color: var(--gold-light);
      font-size: clamp(21px, 6.4vw, 26px);
      line-height: 1.65;
    }

    .opening-subtitle {
      color: #e0d8c2;
      font: 7px "Segoe UI", Arial, sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .envelope-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(105px + var(--safe-top))
        24px
        calc(80px + var(--safe-bottom));
      perspective: 1200px;
    }

    .envelope-box {
      position: relative;
      width: min(350px, 86vw);
      aspect-ratio: 350 / 270;
      filter: drop-shadow(0 22px 28px rgba(17, 27, 18, 0.38));
      transition: transform 0.8s ease 1.15s;
    }

    .opening-active .envelope-box {
      transform: scale(1.05);
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(229, 204, 136, 0.62);
      border-radius: 9px;
      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.08),
          transparent 52%
        ),
        linear-gradient(150deg, #7c9074, #536a54);
    }

    .envelope-interior {
      position: absolute;
      left: 3%;
      right: 3%;
      top: 3%;
      height: 69%;
      border-radius: 8px 8px 45% 45%;
      background: linear-gradient(#253c2b, #4c654d);
    }

    .envelope-glow {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 15%;
      height: 70%;
      opacity: 0;
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse,
          rgba(255,248,208,0.98),
          rgba(242,207,117,0.62) 35%,
          transparent 75%
        );
      transform: scale(0.35);
      transition: opacity 0.8s ease 0.42s, transform 1s ease 0.4s;
    }

    .opening-active .envelope-glow {
      opacity: 1;
      transform: scale(1.45);
    }

    .envelope-flap {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 8;
      width: 100%;
      height: 56%;
      transform-origin: top center;
      transform-style: preserve-3d;
      transition: transform 1.1s cubic-bezier(0.62, 0, 0.22, 1);
    }

    .flap-front,
    .flap-back {
      position: absolute;
      inset: 0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      backface-visibility: hidden;
    }

    .flap-front {
      background: linear-gradient(145deg, #84967b, #536a55);
    }

    .flap-back {
      background: linear-gradient(#d5bd85, #81632e);
      transform: rotateX(180deg);
    }

    .opening-active .envelope-flap {
      z-index: 2;
      transform: rotateX(180deg);
    }

    .envelope-front {
      position: absolute;
      inset: 0;
      z-index: 6;
      overflow: hidden;
      pointer-events: none;
    }

    .front-left {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 50%;
      height: 100%;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      background: #617861;
    }

    .front-right {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 50%;
      height: 100%;
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
      background: #576f59;
    }

    .front-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 54%;
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      background: #73866e;
    }

    .wax-seal {
      position: absolute;
      left: 50%;
      top: 52%;
      z-index: 15;
      width: clamp(72px, 21vw, 88px);
      height: clamp(72px, 21vw, 88px);
      transform: translate(-50%, -50%);
      cursor: pointer;
      border: 4px double #f4dda1;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 32% 27%,
          #edd178,
          #bb8732 48%,
          #6f4a16
        );
      color: #fff1c4;
      box-shadow:
        0 8px 19px rgba(33,21,3,0.48),
        inset 0 0 0 5px rgba(103,65,14,0.25);
      font: italic clamp(14px, 4vw, 17px) Georgia, serif;
      line-height: 1.05;
      transition: opacity 0.38s ease, transform 0.38s ease;
    }

    .opening-active .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
      pointer-events: none;
    }

    .opening-flash {
      position: absolute;
      inset: 0;
      z-index: 20;
      opacity: 0;
      background:
        radial-gradient(
          circle,
          rgba(255,252,226,0.98),
          rgba(255,224,145,0.65) 26%,
          transparent 70%
        );
      transform: scale(0.5);
      transition: opacity 0.7s ease 0.8s, transform 0.9s ease 0.8s;
      pointer-events: none;
    }

    .opening-active .opening-flash {
      opacity: 1;
      transform: scale(1.7);
    }

    .you-are-invited {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(7%, calc(var(--safe-bottom) + 20px));
      z-index: 42;
      color: #e5ca82;
      text-align: center;
    }

    .invited-ornament {
      font-size: 20px;
    }

    .invited-text {
      font: 8px "Segoe UI", Arial, sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Screen 2 */

    #coupleScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(12px, var(--safe-top))
        16px
        max(12px, var(--safe-bottom));
      text-align: center;
      background:
        #f5f0e5
        url("Screen-2.jpg")
        center / cover
        no-repeat;
    }

    .couple-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 390px;
      opacity: 0;
      transform: translateY(20px);
    }

    body.reveal-couple .couple-content {
      animation: revealInvitation 1.2s ease forwards;
    }

    @keyframes revealInvitation {
      to {
        opacity: 1;
        transform: none;
      }
    }

    .bismillah {
      color: #926d28;
      font-family: "Geeza Pro", "Traditional Arabic", serif;
      font-size: clamp(21px, 6.3vw, 28px);
      line-height: 1.45;
    }

    .screen2-ornament {
      color: #ad8435;
      font-size: 16px;
      margin: 1px 0 3px;
    }

    .faith-heading {
      color: #654f34;
      font: 600 clamp(7px, 2.1vw, 9px) "Segoe UI", Arial, sans-serif;
      letter-spacing: 2.4px;
      line-height: 1.45;
      text-transform: uppercase;
    }

    .heart-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 118px;
      margin: 3px auto;
      color: #a7833e;
      font-size: 8px;
    }

    .heart-divider::before,
    .heart-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      margin: 0 8px;
      background: linear-gradient(90deg, transparent, #b58d43);
    }

    .heart-divider::after {
      transform: rotate(180deg);
    }

    .blessing-copy {
      max-width: 300px;
      margin: 3px auto 4px;
      color: #5d5548;
      font-size: clamp(10px, 2.7vw, 12px);
      font-style: italic;
      line-height: 1.3;
    }

    .couple-name {
      max-width: 385px;
      margin: 4px auto 0;
      color: #393128;
      font-family:
        "Snell Roundhand",
        "Apple Chancery",
        "Segoe Script",
        "Brush Script MT",
        cursive;
      font-size: clamp(38px, 10.2vw, 49px);
      font-weight: 400;
      line-height: 0.98;
      text-wrap: balance;
      text-shadow: 0 1px 1px #fff;
    }

    .couple-name.long {
      font-size: clamp(32px, 8.7vw, 42px);
      line-height: 1;
    }

    .parent-role {
      margin-top: 2px;
      color: #927842;
      font-family: "Segoe Script", cursive;
      font-size: clamp(9px, 2.6vw, 11px);
    }

    .parent-name {
      margin-top: 1px;
      color: #625746;
      font: clamp(7px, 2vw, 9px) "Segoe UI", Arial, sans-serif;
      letter-spacing: 0.6px;
    }

    .ampersand {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      margin: 3px auto 1px;
      color: #ae8436;
      font-family: "Segoe Script", cursive;
      font-size: 25px;
    }

    .ampersand::before,
    .ampersand::after {
      content: "";
      flex: 1;
      height: 1px;
      margin: 0 8px;
      background: linear-gradient(90deg, transparent, #b99145);
    }

    .ampersand::after {
      transform: rotate(180deg);
    }

    .tagline {
      margin-top: 5px;
      color: #8f7137;
      font: 600 clamp(5px, 1.55vw, 6.5px) "Segoe UI", Arial, sans-serif;
      letter-spacing: 1.35px;
      line-height: 1.45;
      text-transform: uppercase;
    }

    .tagline span {
      margin: 0 4px;
      color: #b48635;
    }

    /* Enhanced Continue button */

    .continue-cue {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 215px;

      background: rgba(255,250,239,0.88);

      box-shadow:
        0 5px 18px rgba(110,84,36,0.13),
        inset 0 0 0 1px rgba(255,255,255,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: continuePulse 2.2s ease-in-out infinite;
    }

    .continue-cue::before {
      content: "";
      position: absolute;
      inset: -4px;
      border: 1px solid rgba(190,148,72,0.18);
      border-radius: 32px;
      pointer-events: none;
    }

    .continue-text {
      font: 700 clamp(6px, 1.9vw, 8px) "Segoe UI", Arial, sans-serif;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .continue-arrows {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 21px;
      margin-top: 2px;
      color: #ad7e2e;
    }

    .continue-arrows span {
      display: block;
      height: 10px;
      font-size: 20px;
      line-height: 10px;
      animation: continueArrow 1.3s ease-in-out infinite;
    }

    .continue-arrows span:nth-child(2) {
      animation-delay: 0.16s;
    }

    @keyframes continueArrow {
      0% {
        opacity: 0.25;
        transform: translateY(-2px);
      }

      50% {
        opacity: 1;
        transform: translateY(4px);
      }

      100% {
        opacity: 0.25;
        transform: translateY(7px);
      }
    }

    @keyframes continuePulse {
      0%,
      100% {
        transform: translateY(0);
        box-shadow:
          0 5px 18px rgba(110,84,36,0.1),
          inset 0 0 0 1px rgba(255,255,255,0.55);
      }

      50% {
        transform: translateY(2px);
        box-shadow:
          0 8px 24px rgba(183,137,53,0.28),
          inset 0 0 0 1px
