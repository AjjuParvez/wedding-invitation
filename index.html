<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  background: #d8d0bc;
}

body {
  margin: 0 auto;
  width: 100%;
  max-width: 390px;
  min-height: 100vh;
  background: #344735;
  color: #f5ecd6;
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden;
  box-shadow: 0 0 45px rgba(0,0,0,.35);
}

.cover {
  min-height: 100vh;
  min-height: 100svh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 22px;
  overflow: hidden;

  background:
    radial-gradient(
      circle at top,
      rgba(104,124,91,.35),
      transparent 42%
    ),
    linear-gradient(
      160deg,
      #52654b 0%,
      #354936 48%,
      #223428 100%
    );
}

.ornament {
  position: absolute;
  color: rgba(221,197,133,.12);
  font-size: 200px;
  line-height: 1;
  pointer-events: none;
}

.ornament.top {
  top: -45px;
  left: -70px;
  transform: rotate(25deg);
}

.ornament.bottom {
  bottom: -55px;
  right: -65px;
  transform: rotate(205deg);
}

.frame {
  position: absolute;
  inset: 13px;
  border: 1px solid rgba(231,207,146,.45);
  border-radius: 26px;
  pointer-events: none;
}

.content {
  position: relative;
  z-index: 5;
  width: 100%;
  text-align: center;
}

.arabic {
  color: #ead59f;
  font-size: 27px;
  line-height: 1.7;
  margin-bottom: 10px;
}

.intro {
  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #cfc6af;
  margin-bottom: 55px;
}

.envelope-wrap {
  position: relative;
  width: 290px;
  height: 210px;
  margin: 0 auto;
  perspective: 1000px;
  cursor: pointer;
}

.envelope {
  position: absolute;
  bottom: 0;
  width: 290px;
  height: 180px;
  background: #d7c8a6;
  box-shadow: 0 18px 35px rgba(0,0,0,.38);
}

.envelope-left {
  position: absolute;
  left: 0;
  bottom: 0;

  width: 0;
  height: 0;

  border-top: 90px solid transparent;
  border-bottom: 90px solid #cabb98;
  border-right: 145px solid transparent;
}

.envelope-right {
  position: absolute;
  right: 0;
  bottom: 0;

  width: 0;
  height: 0;

  border-top: 90px solid transparent;
  border-bottom: 90px solid #bdad89;
  border-left: 145px solid transparent;
}

.envelope-bottom {
  position: absolute;
  bottom: 0;

  width: 0;
  height: 0;

  border-left: 145px solid transparent;
  border-right: 145px solid transparent;
  border-bottom: 100px solid #dfd0ad;
}

.flap {
  position: absolute;
  top: 30px;
  left: 0;

  width: 0;
  height: 0;

  border-left: 145px solid transparent;
  border-right: 145px solid transparent;
  border-top: 110px solid #e6dabd;

  transform-origin: top center;
  transition: transform 1s ease;
  z-index: 4;
}

.card {
  position: absolute;
  width: 240px;
  height: 160px;
  left: 25px;
  bottom: 15px;

  background: #f8f1df;
  color: #42513d;

  border: 1px solid #dac38a;

  display: flex;
  flex-direction: column;
  justify-content: center;

  transition:
    transform 1.1s ease .35s,
    opacity .7s ease;

  z-index: 2;
}

.card-small {
  font-family: Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 8px;
  color: #9b8250;
}

.card-title {
  font-size: 27px;
  font-style: italic;
  margin: 8px 0;
}

.card-line {
  width: 70px;
  height: 1px;
  background: #b99855;
  margin: 5px auto 10px;
}

.card-text {
  font-size: 11px;
  letter-spacing: 1px;
}

.seal {
  position: absolute;
  z-index: 7;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  left: 50%;
  top: 95px;

  transform: translateX(-50%);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 30px;
  color: #fff2c7;

  border: 3px double #eedc9c;

  background:
    radial-gradient(
      circle at 32% 27%,
      #e8cd78 0%,
      #bc8a32 48%,
      #725019 100%
    );

  box-shadow: 0 5px 14px rgba(0,0,0,.38);

  transition:
    opacity .45s ease,
    transform .45s ease;
}

.open .flap {
  transform: rotateX(180deg);
  z-index: 1;
}

.open .card {
  transform: translateY(-125px);
}

.open .seal {
  opacity: 0;
  transform:
    translateX(-50%)
    scale(.5);
}

.tap {
  margin-top: 45px;
  font-size: 24px;
  font-style: italic;
  color: #f2e8d0;
}

.tap-sub {
  margin-top: 8px;
  font-family: Arial, sans-serif;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #c9c2ae;
}

.arrow {
  margin-top: 14px;
  color: #d9bd74;
  font-size: 20px;
  animation: bounce 1.4s infinite ease-in-out;
}

@keyframes bounce {
  0%,100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(7px);
  }
}

@media (min-width: 391px) {
  body {
    min-height: 844px;
  }

  .cover {
    min-height: 844px;
  }
}
</style>
</head>

<body>

<section class="cover">

  <div class="frame"></div>

  <div class="ornament top">❧</div>
  <div class="ornament bottom">❧</div>

  <div class="content">

    <div class="arabic">
      بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
    </div>

    <div class="intro">
      A Celebration of Love & Family
    </div>

    <div
      class="envelope-wrap"
      id="envelope"
      onclick="openEnvelope()"
    >

      <div class="card">

        <div class="card-small">
          You're Invited
        </div>

        <div class="card-title">
          Wedding Invitation
        </div>

        <div class="card-line"></div>

        <div class="card-text">
          A beautiful beginning awaits...
        </div>

      </div>

      <div class="envelope">

        <div class="envelope-left"></div>
        <div class="envelope-right"></div>
        <div class="envelope-bottom"></div>

      </div>

      <div class="flap"></div>

      <div class="seal">
        ❦
      </div>

    </div>

    <div class="tap" id="tapText">
      Tap to Open
    </div>

    <div class="tap-sub">
      A special invitation awaits you
    </div>

    <div class="arrow">
      ↓
    </div>

  </div>

</section>

<script>
let opened = false;

function openEnvelope() {

  if (opened) return;

  opened = true;

  const envelope =
    document.getElementById("envelope");

  envelope.classList.add("open");

  document.getElementById("tapText")
    .textContent = "Welcome";

}
</script>

</body>
</html>
